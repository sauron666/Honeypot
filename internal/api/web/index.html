<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRAGE</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%234b9fff' stroke-width='2.5'/><circle cx='16' cy='16' r='4' fill='%234b9fff'/></svg>">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-dot"></span>
    <span class="brand-name">MIRAGE</span>
  </div>
  <nav class="nav" id="nav"></nav>
  <button class="sidebar-toggle" id="sidebar-toggle" title="Toggle sidebar">
    <span class="toggle-icon"></span>
  </button>
</aside>

<div class="app-shell" id="app-shell">
  <header class="topbar">
    <h1 class="topbar-title" id="page-title">Dashboard</h1>
    <div class="topbar-status" id="topbar-status"></div>
    <div class="topbar-actions">
      <label class="live-label" title="Auto-refresh every 3 seconds">
        <input type="checkbox" id="live-toggle" checked>
        <span>Live</span>
      </label>
    </div>
  </header>
  <main class="content" id="content"></main>
</div>

<div class="drawer-overlay" id="drawer-overlay"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button class="btn-close" id="drawer-close" title="Close">&#215;</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="modal-overlay" id="modal-overlay" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="modal-head"><h3 id="modal-title"></h3></div>
  <div class="modal-body" id="modal-body"></div>
  <div class="modal-foot">
    <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
    <button class="btn btn-danger" id="modal-ok">Confirm</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/app.js"></script>
</body>
</html>
