<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIRAGE</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128064;</text></svg>">
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span> MIRAGE</div>
  <div class="stats" id="stats"></div>
  <div class="actions">
    <label class="live"><input type="checkbox" id="autorefresh" checked> live</label>
    <button id="selftest" title="Attack the decoys and check that each probe was recorded">self-test</button>
    <button id="verify" title="Replay the evidence hash chain">verify evidence</button>
  </div>
</header>

<main>
  <section class="pane" id="left-pane">
    <nav class="tabs" id="left-tabs">
      <button class="tab active" data-view="engagements">Engagements</button>
      <button class="tab" data-view="tokens">Honeytokens</button>
      <button class="tab" data-view="decoys">Decoys</button>
    </nav>

    <div class="view" id="view-engagements">
      <p class="note">One attacker, one story. Ordered by risk.</p>
      <div id="engagements" class="list"></div>
    </div>

    <div class="view" id="view-tokens" hidden>
      <div class="mint">
        <select id="token-type"></select>
        <input id="token-label" type="text" placeholder="label, e.g. finance share key">
        <input id="token-location" type="text" placeholder="where you will plant it">
        <button id="token-mint">mint</button>
      </div>
      <p class="note">Bait with no infrastructure. Nothing legitimate ever touches one.</p>
      <div id="tokens" class="list"></div>
    </div>

    <div class="view" id="view-decoys" hidden>
      <p class="note">What this deployment presents to the network.</p>
      <div id="decoys" class="list"></div>
    </div>
  </section>

  <section class="pane" id="right-pane">
    <nav class="tabs" id="right-tabs">
      <button class="tab active" data-view="events">Events</button>
      <button class="tab" data-view="detections" id="tab-detections">Detections</button>
      <span class="context" id="context-label">all events</span>
      <button id="clear-filter" class="link" hidden>clear filter</button>
    </nav>

    <div class="view" id="view-events">
      <div class="filters">
        <input id="q" type="search" placeholder="search commands, paths, payloads, IPs">
        <select id="severity">
          <option value="">any severity</option>
          <option value="low">low+</option>
          <option value="medium">medium+</option>
          <option value="high">high+</option>
          <option value="critical">critical</option>
        </select>
      </div>
      <div id="events" class="list"></div>
    </div>

    <div class="view" id="view-detections" hidden>
      <div class="detect-head">
        <span id="detect-summary" class="note">Select an engagement to generate detection content from it.</span>
        <span class="grow"></span>
        <a id="dl-sigma" class="dl" hidden>sigma</a>
        <a id="dl-suricata" class="dl" hidden>suricata</a>
        <a id="dl-yara" class="dl" hidden>yara</a>
        <a id="dl-stix" class="dl" hidden>stix</a>
        <a id="dl-report" class="dl" hidden>report</a>
      </div>
      <div id="detections" class="list"></div>
    </div>
  </section>
</main>

<div id="detail" class="drawer" hidden>
  <div class="drawer-head">
    <strong id="detail-title"></strong>
    <button id="detail-close">close</button>
  </div>
  <div id="detail-body"></div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
