# Profile P7 - home lab / research
#
# The reference deployment used to develop MIRAGE: a Proxmox node, an OPNsense
# firewall, an isolated deception VLAN and a small Active Directory.
#
# Network layout (zone names are abstractions; the fabric driver maps them):
#   ZONE PROD   vmbr0   real network (192.168.1.0/24)
#   ZONE MGMT   vmbr0   hypervisor, firewall, MIRAGE control plane
#   ZONE DIRTY  vmbr1   decoys, with no route to PROD or MGMT
#
# The decoys below still run in-process (compute: inproc), which is the right
# starting point: put the box in VLAN 666 with a single interface, redirect the
# real ports to the unprivileged ones, and you have a full decoy segment without
# a single VM. Move to compute: proxmox when you want full-OS decoys with
# agentless introspection.

tenant: homelab
site: sofia-lab

data_dir: /var/lib/mirage

api:
  # Management interface: accessible from the LAN.
  listen: 0.0.0.0:8422
  # token: change-me   # uncomment in production
  public_url: http://192.168.1.100:8422

honeyd:
  bind: 0.0.0.0
  max_session_duration: 45m
  max_conns_per_ip: 40
  max_conns_total: 4000

  decoys:
    - id: dcy-web01
      persona: linux/web
      services:
        - {service: ssh,    port: 2222}
        - {service: http,   port: 8080}
        - {service: ftp,    port: 2121}
        - {service: telnet, port: 2323}
        - {service: smtp,   port: 2525}
        - {service: tokens, port: 8081}

    - id: dcy-db01
      persona: linux/db
      services:
        - {service: ssh,   port: 2223}
        - {service: redis, port: 6380}
        - {service: mysql, port: 3307}
        - {service: mssql, port: 14330}

    - id: dcy-nas01
      persona: linux/backup
      services:
        - {service: ssh,    port: 2224}
        - {service: ftp,    port: 2122}
        - {service: vnc,    port: 5901}
        - {service: snmp,   port: 1161}

    - id: dcy-fs01
      persona: linux/fileserver
      services:
        - {service: ftp, port: 2123}
        - {service: ssh, port: 2225}
        - {service: smb, port: 4445}

    - id: dcy-dc01
      persona: windows/dc
      services:
        - {service: ldap,     port: 3389}
        - {service: smb,      port: 4446}
        - {service: kerberos, port: 8888, proto: tcp}
        - {service: kerberos, port: 8888, proto: udp}

    - id: dcy-plc01
      persona: linux/backup
      services:
        - {service: modbus, port: 5020}

engagement:
  idle_timeout: 30m

alerts:
  min_severity: high
  sinks:
    - driver: file
      config:
        path: alerts.jsonl
    - driver: stdout
      config: {}
    # Uncomment for syslog forwarding to a SIEM:
    # - driver: syslog
    #   config:
    #     address: 192.168.1.20:514
    #     network: udp

storage:
  memory_window: 500000
  sync_every: 1

drivers:
  compute: inproc

  # Proxmox compute driver for full-OS VM decoys (P4 profile).
  # Uncomment to manage VMs on the local Proxmox node.
  # compute: proxmox
  # compute_config:
  #   url: "https://192.168.1.100:8006"
  #   user: "root@pam"
  #   password: "change-me"
  #   node: "proxmox"
  #   pool: "mirage"
  #   # Proxmox ships a self-signed certificate. Rather than trusting it blindly
  #   # (verify_tls: false with no pin is a MITM risk), pin the node's SHA-256 —
  #   # the PVE UI shows it, or: pvesh get /nodes/<node>/status returns it, and
  #   # the API's node list carries ssl_fingerprint. With a pin set, a swapped
  #   # certificate is refused.
  #   verify_tls: false
  #   tls_fingerprint: "0D:06:D1:2A:9E:FA:48:55:E9:A4:2B:23:23:A1:5C:0F:FB:85:2A:48:E4:FD:AF:DE:53:8E:47:32:26:27:F4:60"
  #   # For production, prefer an API token over a password:
  #   # token_id: "mirage@pve!automation"
  #   # token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Full-OS VM decoys (uncomment when compute: proxmox is active)
# vms:
#   containment: enforced
#   decoys:
#     - id: vm-web01
#       persona: linux/web
#       template: "9000"       # VMID of cloud-init Ubuntu template
#       cpus: 2
#       memory_mb: 1024
#       revert: on_engagement_end
