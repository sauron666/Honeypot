# Profile P0 - "honeypot in a box"
#
# One process, no hypervisor, no containers, no root. Three decoys with
# consistent identities answering six services. This is the ten-minute install
# described in docs/06-DEPLOYMENT-PROFILES.md and the Community edition default.
#
#   make build && ./bin/mirage-director --config profiles/p0-box.yaml
#   open http://127.0.0.1:8422
#
# Ports are unprivileged on purpose: never run a honeypot as root. To present
# the real ports, redirect them at the firewall, e.g.
#   nft add rule inet nat prerouting tcp dport 22 redirect to :2222

tenant: default
site: box

data_dir: ./data

api:
  # The management console. Keep it on loopback or a management network;
  # it must never be reachable from the decoy segment (docs/04).
  listen: 127.0.0.1:8422
  # token: set-me-if-not-on-loopback

honeyd:
  bind: 0.0.0.0
  max_session_duration: 30m
  max_conns_per_ip: 25

  decoys:
    - id: dcy-web01
      persona: linux/web
      services:
        - service: ssh
          port: 2222
        - service: http
          port: 8080
        - service: ftp
          port: 2121
        - service: telnet
          port: 2323
        - service: smtp
          port: 2525
        # Honeytoken callbacks. This must be reachable by whoever finds a
        # token, which is why it is a decoy service and not part of the
        # management API.
        - service: tokens
          port: 8081

    - id: dcy-db01
      persona: linux/db
      services:
        - service: ssh
          port: 2223
        - service: redis
          port: 6380
        - service: mysql
          port: 3307
        - service: mssql
          port: 14330

    - id: dcy-nas01
      persona: linux/backup
      services:
        - service: ssh
          port: 2224
        - service: ftp
          port: 2122
        - service: vnc
          port: 5901
        - service: snmp     # UDP; answers are bounded so a decoy never amplifies
          port: 1161

    # The decoy a ransomware operator is looking for: a file share full of the
    # documents that make a company pay. The share is generated, so thousands
    # of believable files cost a few megabytes of memory. Canary files sort
    # first in every directory, and the ransomware engine watches every write.
    - id: dcy-fs01
      persona: linux/fileserver
      services:
        - service: ftp
          port: 2123
        - service: ssh
          port: 2225
        # SMB. The NTLM exchange yields a NetNTLMv2 hash in the format hashcat
        # expects, plus the attacker's workstation name -- which survives their
        # IP rotating. Redirect 445 here at the firewall.
        - service: smb
          port: 4445

    # An industrial decoy. A PLC cannot run an agent, which makes a passive
    # decoy the only detection some plants can have at all.
    - id: dcy-plc01
      persona: linux/backup
      services:
        - service: modbus
          port: 5020
          options:
            vendor: Siemens
            product: SIMATIC S7-1200
            revision: 4.4.1

    # Projection: one decoy occupying several addresses. The addresses must
    # exist on the host first, e.g.
    #   ip addr add 10.66.0.31/24 dev eth0
    # Uncomment once the addresses are configured.
    # - id: dcy-fleet
    #   persona: linux/web
    #   addresses: ["10.66.0.31", "10.66.0.32", "10.66.0.33"]
    #   services:
    #     - {service: ssh,  port: 22}
    #     - {service: http, port: 80}

engagement:
  # How long a source can be quiet before its visit is considered finished.
  idle_timeout: 30m

alerts:
  # Deception's promise is few alerts, all real. Lowering this floods the SIEM.
  min_severity: high
  sinks:
    - driver: stdout
    - driver: file
      config:
        path: alerts.jsonl

tokens:
  # What an attacker can reach. Minted callback URLs point here, so it has to
  # be the decoy-facing address, never the management one.
  base_url: http://127.0.0.1:8081

storage:
  memory_window: 200000
  sync_every: 1

drivers:
  compute: inproc
