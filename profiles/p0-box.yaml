# Profile P0 - "honeypot in a box"
#
# One process, no hypervisor, no containers, no root. Three decoys with
# consistent identities answering six services. This is the ten-minute install
# described in docs/06-DEPLOYMENT-PROFILES.md and the Community edition default.
#
#   make build && ./bin/mirage-director --config profiles/p0-box.yaml
#   open http://127.0.0.1:8422
#
# Ports are unprivileged on purpose: never run a honeypot as root. To present
# the real ports, redirect them at the firewall, e.g.
#   nft add rule inet nat prerouting tcp dport 22 redirect to :2222

tenant: default
site: box

data_dir: ./data

api:
  # The management console. Keep it on loopback or a management network;
  # it must never be reachable from the decoy segment (docs/04).
  listen: 127.0.0.1:8422
  # token: set-me-if-not-on-loopback

honeyd:
  bind: 0.0.0.0
  max_session_duration: 30m
  max_conns_per_ip: 25

  decoys:
    - id: dcy-web01
      persona: linux/web
      services:
        - service: ssh
          port: 2222
        - service: http
          port: 8080
        - service: ftp
          port: 2121
        - service: telnet
          port: 2323
        - service: smtp
          port: 2525

    - id: dcy-db01
      persona: linux/db
      services:
        - service: ssh
          port: 2223
        - service: redis
          port: 6380
        - service: mysql
          port: 3307
        - service: mssql
          port: 14330

    - id: dcy-nas01
      persona: linux/backup
      services:
        - service: ssh
          port: 2224
        - service: ftp
          port: 2122
        - service: vnc
          port: 5901
        - service: snmp     # UDP; answers are bounded so a decoy never amplifies
          port: 1161

    # An industrial decoy. A PLC cannot run an agent, which makes a passive
    # decoy the only detection some plants can have at all.
    - id: dcy-plc01
      persona: linux/backup
      services:
        - service: modbus
          port: 5020
          options:
            vendor: Siemens
            product: SIMATIC S7-1200
            revision: 4.4.1

    # Projection: one decoy occupying several addresses. The addresses must
    # exist on the host first, e.g.
    #   ip addr add 10.66.0.31/24 dev eth0
    # Uncomment once the addresses are configured.
    # - id: dcy-fleet
    #   persona: linux/web
    #   addresses: ["10.66.0.31", "10.66.0.32", "10.66.0.33"]
    #   services:
    #     - {service: ssh,  port: 22}
    #     - {service: http, port: 80}

engagement:
  # How long a source can be quiet before its visit is considered finished.
  idle_timeout: 30m

alerts:
  # Deception's promise is few alerts, all real. Lowering this floods the SIEM.
  min_severity: high
  sinks:
    - driver: stdout
    - driver: file
      config:
        path: alerts.jsonl

storage:
  memory_window: 200000
  sync_every: 1

drivers:
  compute: inproc
